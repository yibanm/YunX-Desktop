name: build-windows

# Windows 便携版 + 安装程序自动构建
# 触发：push 到 main/master，或手动 workflow_dispatch
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Build portable package
        shell: pwsh
        run: ./portable-package.ps1

      - name: Build installer
        shell: pwsh
        run: ./installer-package.ps1

      - name: Compress portable package
        shell: pwsh
        run: Compress-Archive -Path release/YunX-Desktop -DestinationPath release/YunX-Desktop-portable-1.1.3.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-Desktop-portable
          path: release/YunX-Desktop-portable-1.1.3.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-Desktop-installer
          path: release/YunX-Desktop-setup-1.1.3.exe
